{% extends 'base.html' %}{% block title %}بياناتي — ريجويا{% endblock %}{% block content %}<section class="page-intro container"><span class="eyebrow">حسابك</span><h1>بياناتي<em>.</em></h1></section><section class="container account-layout"><nav class="account-menu"><a href="{{ url_for('account.dashboard') }}">لوحة حسابي</a><a class="active" href="{{ url_for('account.profile') }}">بياناتي</a><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-link">تسجيل الخروج</button></form></nav><div class="account-content"><h2>تفاصيل التواصل</h2><form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field">الاسم الكامل<input class="form-control" name="full_name" value="{{ current_user.full_name }}" required minlength="2" maxlength="120"></label><label class="field">البريد الإلكتروني<input class="form-control" value="{{ current_user.email }}" disabled></label><label class="field">رقم الهاتف<input class="form-control" name="phone" value="{{ current_user.phone }}" required minlength="8" maxlength="30"></label><button class="btn-jade">حفظ التغييرات</button></form></div></section>{% endblock %}
