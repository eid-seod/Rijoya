{% extends 'admin/base.html' %}{% block title %}{{ 'تعديل المنتج' if product.id else 'منتج جديد' }} — ريجويا{% endblock %}{% block admin_content %}<div class="admin-head"><div><h1>{{ 'تعديل المنتج' if product.id else 'إضافة منتج' }}</h1><p>أدخل تفاصيل المنتج والمخزون.</p></div><a class="admin-btn secondary" href="{{ url_for('admin.products') }}">العودة للقائمة</a></div><form method="post" enctype="multipart/form-data" class="admin-form">{{ form.hidden_tag() }}<div class="admin-form-grid"><label class="field">{{ form.name.label }}{{ form.name(class_='form-control') }}{% for e in form.name.errors %}<small class="field-error">{{ e }}</small>{% endfor %}</label><label class="field">{{ form.category_id.label }}{{ form.category_id(class_='form-select') }}</label><label class="field">{{ form.sku.label }}{{ form.sku(class_='form-control') }}{% for e in form.sku.errors %}<small class="field-error">{{ e }}</small>{% endfor %}</label><label class="field">{{ form.price.label }}{{ form.price(class_='form-control') }}{% for e in form.price.errors %}<small class="field-error">{{ e }}</small>{% endfor %}</label><label class="field">{{ form.compare_at_price.label }}{{ form.compare_at_price(class_='form-control') }}</label><label class="field">{{ form.stock.label }}{{ form.stock(class_='form-control') }}{% for e in form.stock.errors %}<small class="field-error">{{ e }}</small>{% endfor %}</label><label class="field full">{{ form.description.label }}{{ form.description(class_='form-control') }}</label><label class="field full">{{ form.image.label }}{{ form.image(class_='form-control') }}<small class="text-secondary">PNG, JPG, WEBP أو GIF — حتى 5MB</small>{% if product.image %}<small>الصورة الحالية: {{ product.image }}</small>{% endif %}</label><label class="admin-check">{{ form.is_active() }} {{ form.is_active.label.text }}</label><label class="admin-check">{{ form.is_featured() }} {{ form.is_featured.label.text }}</label></div><div class="admin-actions mt-4"><button class="admin-btn">حفظ المنتج</button><a class="admin-btn secondary" href="{{ url_for('admin.products') }}">إلغاء</a></div></form>{% endblock %}
